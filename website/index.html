<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
        
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }
        .bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("ai-cyborg-background.png");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: white;
            font-size: 5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background-color: rgba(0, 0, 0, 0.6);
            color: #00ffff;
            padding: 16px 24px;
            font-size: 1.2rem;
            border: 2px solid #00ffff;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        .dropbtn:hover {
            background-color: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0, 255, 255, 0.2);
            z-index: 1;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
        .dropdown-content a {
            color: #00ffff;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
            text-align: center;
        }
        .dropdown-content a:hover {
            background-color: rgba(0, 255, 255, 0.1);
            transform: scale(1.05);
        }
        .show {
            display: block;
            animation: fadeIn 0.3s ease, slideDown 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translateY(-10px) translateX(-50%); }
            to { transform: translateY(0) translateX(-50%); }
        }
    </style>
</head>
<body>
    <div class="bg">
        <h1>ANTI AI</h1>
        <div class="dropdown">
            <button onclick="toggleDropdown()" class="dropbtn">Explore Features</button>
            <div id="myDropdown" class="dropdown-content">
                <a href="#">AI Detection</a>
                <a href="#">Content Protection</a>
                <a href="#">Privacy Shield</a>
                <a href="#">Human Verification</a>
            </div>
        </div>
    </div>

    <script>
        function toggleDropdown() {
            document.getElementById("myDropdown").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
